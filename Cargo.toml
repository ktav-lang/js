[package]
name = "ktav-js"
version = "0.1.0"
edition = "2021"
description = "JavaScript/TypeScript bindings for the Ktav configuration format"
license = "MIT"
repository = "https://github.com/ktav-lang/js"
rust-version = "1.70"
publish = false

# Which version of the Ktav format specification these bindings implement.
[package.metadata.ktav]
spec-version = "0.1.0"

[lib]
name = "ktav"
crate-type = ["cdylib", "rlib"]

[dependencies]
ktav = "0.1"
wasm-bindgen = "0.2"
js-sys = "0.3"
indexmap = "2"
rustc-hash = "2"
itoa = "1"
ryu = "1"

[profile.release]
# LTO + single codegen unit: inline across `ktav` → `ktav-js` → wasm-bindgen
# glue. For the wasm target the FFI boundary dominates on small documents.
lto = "fat"
codegen-units = 1
# Optimize for size on wasm — byte-count matters for browser delivery,
# and `opt-level = "z"` is usually within a few % of `3` on this workload.
opt-level = "z"
debug = false
overflow-checks = false
incremental = false
# wasm-bindgen requires unwinding-style panics (converted to JS errors).
panic = "abort"
# NOTE: wasm target has no unwinding at all — panic = "abort" is both
# smaller and correct. wasm-bindgen routes `JsError` without panics.

# Fast-iteration profile for active development. `lto = "fat"` makes
# linking 3–5× slower than a no-LTO release build. Activate via:
#     wasm-pack build --dev  (or cargo build --profile dev-opt)
[profile.dev-opt]
inherits = "release"
lto = false
codegen-units = 16
opt-level = 1
