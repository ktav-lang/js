[workspace]
resolver = "2"
members = [
    "crates/wasm",
    "crates/napi",
    "crates/cabi",
]

# Shared metadata — version / edition / licensing stays in sync across
# both bindings since they publish as a single npm package `ktav`.
[workspace.package]
version = "0.1.4"
edition = "2021"
license = "MIT"
repository = "https://github.com/ktav-lang/js"
rust-version = "1.70"

[workspace.dependencies]
ktav = "0.1.5"
indexmap = "2"
rustc-hash = "2"
itoa = "1"
ryu = "1"

[profile.release]
# LTO + single codegen unit: inline across `ktav` → binding → runtime
# glue. For small documents the FFI boundary dominates, so this is the
# single biggest lever on both the wasm and napi paths.
lto = "fat"
codegen-units = 1
debug = false
overflow-checks = false
incremental = false
opt-level = 3

# wasm-specific size tuning — byte-count matters for browser delivery,
# and `opt-level = "z"` is usually within a few % of `3` on this
# workload. napi stays at opt-level = 3 for raw throughput.
[profile.release.package.ktav-wasm]
opt-level = "z"

# Fast-iteration profile. `lto = "fat"` makes linking 3–5× slower than
# a no-LTO release build; during active development that dominates.
[profile.dev-opt]
inherits = "release"
lto = false
codegen-units = 16
opt-level = 1
