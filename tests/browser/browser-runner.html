<!DOCTYPE html>
<html>
<head><meta charset="UTF-8"><title>ktav browser test runner</title></head>
<body>
<pre id="log"></pre>
<script type="module">
    console.log("[runner] module start");
    // Dynamic imports so we can log between each and narrow failures.
    console.log("[runner] fetching assertions.mjs");
    const { runAll } = await import("/tests/shared/assertions.mjs");
    console.log("[runner] fetching dist/ts/web.js");
    const { loads, loadsStrict, loadsBytes, dumps, stringifyForceStrings, format, canonicalFromSource, ready } = await import("/dist/ts/web.js");
    console.log("[runner] imports resolved");

    await ready();
    console.log("[runner] ready() done");

    const manifest = await fetch("/__manifest").then(r => r.json());

    // Browser fetch adapter — synchronous adapter over a pre-warmed
    // Map. `runAll` calls `readTextFile` synchronously, so we must
    // fetch every fixture before kicking the suite off.
    const cache = new Map();
    const byteCache = new Map();
    if (manifest.specDir) {
        const path = manifest.specDir + "/manifest.json";
        cache.set(path, await fetch("/" + path).then(r => {
            if (!r.ok) throw new Error("failed to fetch corpus manifest: " + path);
            return r.text();
        }));
    }
    const allFiles = [...manifest.valid, ...manifest.invalid, ...manifest.parseableUnrepresentable, ...manifest.strictLossy];
    for (const f of allFiles) {
        cache.set(f, await fetch("/" + f.replace(/^\/+/, "")).then(r => r.text()));
        const json = f.replace(/\.ktav$/, ".json");
        cache.set(json, await fetch("/" + json.replace(/^\/+/, "")).then(r => r.text()));
    }
    // unrepresentable/ fixtures ship JSON only — fetch text and raw bytes
    // (the byte cache also backs readBytes for the invalid_utf8 fixture).
    for (const f of manifest.unrepresentable) {
        cache.set(f, await fetch("/" + f.replace(/^\/+/, "")).then(r => r.text()));
        byteCache.set(f, new Uint8Array(
            await fetch("/" + f.replace(/^\/+/, "")).then(r => r.arrayBuffer()),
        ));
    }
    // invalid_utf8 fixtures must be readable as raw bytes.
    for (const f of manifest.invalid) {
        if (f.includes("/invalid_utf8/")) {
            byteCache.set(f, new Uint8Array(
                await fetch("/" + f.replace(/^\/+/, "")).then(r => r.arrayBuffer()),
            ));
        }
    }

    // Canonical fixtures: preload each `.canonical.ktav`'s raw BYTES so
    // the sync `readBytes` adapter can serve them (byte-exact canonical
    // conformance compares bytes, not text).
    for (const canonicalPath of Object.values(manifest.canonical || {})) {
        byteCache.set(canonicalPath, new Uint8Array(
            await fetch("/" + canonicalPath.replace(/^\/+/, "")).then(r => r.arrayBuffer()),
        ));
    }

    function walkKtavFiles(dir) {
        // Manifest already carries per-subdir lists; just pick by prefix.
        if (dir.endsWith("/valid")) return [...manifest.valid, ...(manifest.canonicalFiles || [])];
        if (dir.endsWith("/invalid")) return manifest.invalid;
        if (dir.endsWith("/parseable-unrepresentable")) return manifest.parseableUnrepresentable;
        if (dir.endsWith("/strict-lossy")) return manifest.strictLossy;
        return [];
    }

    function listJsonFiles(dir) {
        const category = dir.slice(dir.lastIndexOf("/") + 1);
        return manifest.fixtureJson?.[category] || [];
    }

    function listDirectories(dir) {
        return manifest.categoryDirectories || [];
    }

    const log = document.getElementById("log");
    const result = runAll({
        loads,
        loadsStrict,
        loadsBytes,
        dumps,
        stringifyForceStrings,
        format,
        canonicalFromSource,
        readTextFile: (p) => {
            const v = cache.get(p);
            if (v === undefined) throw new Error("fixture not preloaded: " + p);
            return v;
        },
        readBytes: (p) => {
            const v = byteCache.get(p);
            if (v === undefined) throw new Error("fixture not preloaded: " + p);
            return v;
        },
        walkKtavFiles,
        listJsonFiles,
        listDirectories,
        specDir: manifest.specDir,
        label: "browser",
        log: (m) => { log.textContent += m + "\n"; },
    });
    log.textContent += `\n[browser] ${result.passed}/${result.total} passed, ${result.failed} failed\n`;

    // PURE TypeScript entry in the same real browser: dist/ts/pure.js has
    // no wasm/native dependency, so `test:browser` also proves the pure
    // build works in a browser runtime (loads/dumps/canonicalFromSource/
    // format smoke assertions, judged server-side via __ktavResult).
    console.log("[runner] fetching dist/ts/pure.js");
    const pure = await import("/dist/ts/pure.js");
    let purePassed = 0, pureFailed = 0;
    const pureCheck = (name, fn) => {
        try { fn(); purePassed++; log.textContent += `✔ [pure] ${name}\n`; }
        catch (e) { pureFailed++; log.textContent += `✖ [pure] ${name}: ${e.message || e}\n`; }
    };
    pureCheck("loads smoke", () => {
        const doc = pure.loads("port: 8080\nhost: localhost\ntags: [\n    alpha\n    beta\n]\n");
        if (doc.port !== 8080 || doc.host !== "localhost") throw new Error("scalar mismatch: " + JSON.stringify(doc));
        if (JSON.stringify(doc.tags) !== JSON.stringify(["alpha", "beta"])) throw new Error("tags mismatch");
    });
    pureCheck("dumps/loads round trip", () => {
        const back = pure.loads(pure.dumps(pure.loads("port: 8080\n")));
        if (back.port !== 8080) throw new Error("port lost in round trip");
    });
    pureCheck("canonicalFromSource smoke", () => {
        if (pure.canonicalFromSource("port: 8080\nhost: localhost\n") !== "port: 8080\nhost: localhost\n") {
            throw new Error("canonical output mismatch");
        }
    });
    pureCheck("format smoke", () => {
        const formatted = pure.format("## c\n\n\n\nport: 8080\n");
        if (!formatted.includes("## c") || /\n\n\n/.test(formatted)) throw new Error("format mismatch: " + JSON.stringify(formatted));
    });

    globalThis.__ktavResult = {
        ...result,
        passed: result.passed + purePassed,
        failed: result.failed + pureFailed,
        total: result.total + purePassed + pureFailed,
    };
    console.log(`[runner] pure: ${purePassed} passed, ${pureFailed} failed`);
</script>
</body>
</html>
