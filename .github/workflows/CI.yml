name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  # ------------------------------------------------------------------
  # Rust lint — one crate at a time against the workspace.
  # ------------------------------------------------------------------
  rust-lint:
    name: Rust fmt + clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: rustup target add wasm32-unknown-unknown
      - run: cargo clippy -p ktav-napi --all-targets -- -D warnings
      - run: cargo clippy -p ktav-wasm --target wasm32-unknown-unknown -- -D warnings
      - run: cargo clippy -p ktav-cabi --all-targets -- -D warnings

  # ------------------------------------------------------------------
  # Generated docs — README/CHANGELOG/CONTRIBUTING/SECURITY (+ docs/ru,
  # docs/zh translations) are built by @ktav-lang/polydoc from
  # root-docs/. A hand-edit of a generated file fails here; fix the
  # source units and re-run the generator instead.
  # ------------------------------------------------------------------
  docs:
    name: Docs (generated markdown)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
      - run: npm install
      - run: node scripts/build-docs.mjs --check

  # ------------------------------------------------------------------
  # TypeScript typecheck — reuses the same tsc the publish path runs.
  # ------------------------------------------------------------------
  ts-typecheck:
    name: TypeScript typecheck
    runs-on: ubuntu-latest
    needs: []
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: npm install
      - run: rustup target add wasm32-unknown-unknown
      - name: Install wasm-pack
        uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack
      - name: Build wasm (for #wasm/* type resolution)
        run: npm run build:wasm
      - name: Build napi (so dist/native/ is populated)
        run: npm run build:napi
      - name: tsc
        run: npx tsc -p tsconfig.json

  # ------------------------------------------------------------------
  # Deterministic edit-mutation performance comparison across native
  # and pure implementations (timings are reported without thresholds).
  # ------------------------------------------------------------------
  bench-edit-mutations:
    name: Benchmark — edit mutations (native/pure)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - uses: actions/setup-node@v6
        with:
          node-version: "18"
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: rustup target add wasm32-unknown-unknown
      - run: npm install
      - name: Install wasm-pack
        uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack
      - run: npm run build:napi
      - run: npm run build:wasm
      - run: npm run build:ts
      - run: node tests/node/bench-edit-mutations.mjs

  bench-edit-compare:
    name: Benchmark — baseline vs candidate (pure TS)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: deb515e7f0f1ccf8119bfee258c77fe1e7fb2477
          path: base
          submodules: recursive
      - uses: actions/checkout@v6
        with:
          ref: 81f17cc6f0c3acb7296d7bc44016042d96415a8c
          path: predecessor
          submodules: recursive
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          path: candidate
          submodules: recursive
      - uses: actions/setup-node@v6
        with:
          node-version: "18"
      - name: Identify checkouts
        run: |
          echo "baseline-deb515e=$(git -C base rev-parse HEAD)"
          echo "predecessor-81f17cc=$(git -C predecessor rev-parse HEAD)"
          echo "candidate=$(git -C candidate rev-parse HEAD)"
      - uses: dtolnay/rust-toolchain@stable
      - run: rustup target add wasm32-unknown-unknown
      - name: Install wasm-pack
        uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack
      - name: Install and build baseline
        working-directory: base
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/base-target
        run: |
          npm install
          npm run build:wasm
          npm run build:ts
      - name: Install and build predecessor
        working-directory: predecessor
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/predecessor-target
        run: |
          npm install
          npm run build:wasm
          npm run build:ts
      - name: Install and build candidate
        working-directory: candidate
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/candidate-target
        run: |
          npm install
          npm run build:wasm
          npm run build:ts
      - name: Compare deb515e baseline vs candidate
        run: node candidate/tests/node/bench-edit-compare.mjs base/dist/ts/pure.js candidate/dist/ts/pure.js
      - name: Compare 81f17cc predecessor vs candidate
        run: node candidate/tests/node/bench-edit-compare.mjs predecessor/dist/ts/pure.js candidate/dist/ts/pure.js

  # ------------------------------------------------------------------
  # Cross-runtime test matrix. Each job builds the right bits locally
  # and runs the corresponding test:* script. Keeping them in separate
  # jobs means a Bun regression doesn't block Deno results and vice
  # versa.
  # ------------------------------------------------------------------
  test-node:
    name: Tests — Node ${{ matrix.node }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: ["18", "20", "22"]
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: rustup target add wasm32-unknown-unknown
      - run: npm install
      - name: Install wasm-pack
        uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack
      - run: npm run build
      - run: npm run test:node-napi
      - run: npm run test:node-wasm
      - run: npm run test:edit-napi
      - run: npm run test:edit-wasm
      - run: npm run test:spec09-napi
      - run: npm run test:spec09-wasm

  test-bun:
    name: Tests — Bun / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
      - uses: oven-sh/setup-bun@v2
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: rustup target add wasm32-unknown-unknown
      - run: npm install
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack
      - run: npm run build
      - run: npm run test:bun

      # FFI subexport: build the ktav_cabi cdylib — the test runner
      # picks it up from `target/release/` automatically.
      - name: Build cabi
        run: cargo build --release -p ktav-cabi
      - run: npm run test:bun-ffi

  test-deno:
    name: Tests — Deno / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: rustup target add wasm32-unknown-unknown
      - run: npm install
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack
      - run: npm run build:wasm
      - run: npm run build:ts
      - run: npm run test:deno

      # FFI subexport: build the ktav_cabi cdylib — the test runner
      # picks it up from `target/release/` automatically.
      - name: Build cabi
        run: cargo build --release -p ktav-cabi
      - run: npm run test:deno-ffi

  # ------------------------------------------------------------------
  # FFI empty-source invariant against the DEBUG cabi. Rust
  # slice::from_raw_parts asserts a non-null, aligned source pointer
  # even for length 0 only in debug builds (release hides the
  # violation). The runners deliberately do NOT call setLibraryPath —
  # KTAV_LIB_PATH (set below) drives resolution exclusively, and the
  # resolver throws when the file is missing.
  # ------------------------------------------------------------------
  test-ffi-debug-cabi:
    name: Tests — FFI debug C ABI empty input (bun+deno)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
      - uses: oven-sh/setup-bun@v2
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: npm install
      - run: npm run build:ts
      - name: Build cabi (DEBUG — asserts non-null source slices)
        run: cargo build -p ktav-cabi
      - name: Fail closed if debug artifact missing
        run: test -f target/debug/libktav_cabi.so
      - name: Point KTAV_LIB_PATH at the debug artifact (no silent fallback)
        run: echo "KTAV_LIB_PATH=$GITHUB_WORKSPACE/target/debug/libktav_cabi.so" >> "$GITHUB_ENV"
      - run: npm run test:bun-ffi-empty
      - run: npm run test:deno-ffi-empty

  test-browser:
    name: Tests — Browser (chromium) / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: rustup target add wasm32-unknown-unknown
      - run: npm install
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack
      - run: npm run build:wasm
      - run: npm run build:ts
      - run: npm run test:edit-wasm
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser

  # ------------------------------------------------------------------
  # Pure TypeScript backend — no native or WASM build at all. Proves
  # dist/ts/pure.js imports and runs the FULL conformance suite with
  # dist/native absent, on every OS/Node combination.
  # ------------------------------------------------------------------
  test-node-pure:
    name: Tests — pure TS / Node ${{ matrix.node }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: ["18", "20", "22"]
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm install
      - run: npm run build:ts
      - run: node tests/node/run-node-pure.mjs
      - run: node tests/node/run-edit-pure.mjs
      - run: node tests/node/run-spec09-pure.mjs
      - run: node scripts/check-pure-isolation.mjs

  # ------------------------------------------------------------------
  # Cross-backend agreement: pure vs napi vs wasm on every valid fixture.
  # ------------------------------------------------------------------
  test-cross-backend:
    name: Tests — cross-backend (pure/napi/wasm)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: rustup target add wasm32-unknown-unknown
      - run: npm install
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack
      - run: npm run build
      - run: node tests/node/run-cross-backend.mjs

  # ------------------------------------------------------------------
  # Packaged pure export: npm pack, clean install (no optional native
  # deps), default entry must fail to import, ./pure must work.
  # ------------------------------------------------------------------
  packaged-pure:
    name: Tests — packaged ./pure export
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: rustup target add wasm32-unknown-unknown
      - run: npm install
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack
      - run: npm run build
      - name: npm pack
        run: |
          TGZ="$(npm pack --pack-destination "$RUNNER_TEMP" | tail -n1)"
          echo "KTAV_PACKED_TGZ=$RUNNER_TEMP/$TGZ" >> "$GITHUB_ENV"
      - run: node tests/node/run-packaged-pure.mjs

  # ------------------------------------------------------------------
  # Perf guard: deterministic completeness + runaway ceiling, TS only.
  # ------------------------------------------------------------------
  perf-guard:
    name: Tests — perf guard (pure TS)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
      - run: npm install
      - run: npm run build:ts
      - run: node tests/node/run-perf-checks.mjs

  # Summary job for branch protection — lights up only when every
  # matrix cell passes. Add this as the required check in rulesets.
  test-summary:
    name: Test summary
    runs-on: ubuntu-latest
    needs: [rust-lint, docs, ts-typecheck, test-node, test-node-pure, test-cross-backend, packaged-pure, perf-guard, test-bun, test-deno, test-ffi-debug-cabi, test-browser]
    if: always()
    steps:
      - name: Fail if any upstream job failed
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
