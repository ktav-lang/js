name: Windows GNU NAPI source-bound notice candidate

on:
  pull_request:

permissions:
  contents: read

env:
  SOURCE_REF: 562deb3fde092d63a78f359be095e5079929d0d1

jobs:
  variant:
    name: GNU NAPI variant / ${{ matrix.target }}
    runs-on: windows-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-pc-windows-gnullvm
            compiler: x86_64-w64-mingw32-clang.exe
            machine: '34404'
          - target: aarch64-pc-windows-gnullvm
            compiler: aarch64-w64-mingw32-clang.exe
            machine: '43620'
    env:
      NAPI_TARGET: ${{ matrix.target }}
      NAPI_COMPILER: ${{ matrix.compiler }}
      NAPI_MACHINE: ${{ matrix.machine }}
    steps:
      - uses: actions/checkout@v4
      - name: Preserve only reviewed lock and variant tooling
        shell: python
        run: |
          import os
          import shutil
          from pathlib import Path
          stage = Path(os.environ['RUNNER_TEMP']) / 'gnu-napi-tools'
          stage.mkdir()
          names = ['Cargo.lock', 'scripts/windows_gnu_napi_variant.py', 'ci/test_windows_gnu_napi_variant.py', 'ci/fixtures/windows-gnu-napi/project-build.rs.txt', 'ci/fixtures/windows-gnu-napi/project-Cargo.toml.txt',
                   'scripts/prepare_gnu_napi_variant_notices.py', 'scripts/stage_gnu_napi_variant.py', 'scripts/napi_gnullvm_notices.py', 'scripts/rust_compiler_notices.py', 'scripts/cargo_notice_bundle.py', 'scripts/collect_cargo_notices.py', 'scripts/source_license_supplements.py', 'scripts/patch_napi_notice_source.py', 'scripts/check_embedded_notices.py', 'ci/about.toml', 'ci/licenses/js-source-supplements.json', 'ci/licenses/napi-gnullvm-runtime.json', 'ci/rust-compiler-notices.json', 'ci/test_napi_gnullvm_notices.py', 'ci/fixtures/windows-gnu-napi/project-config.toml.txt', 'ci/fixtures/windows-gnu-napi/resource-build.rs.txt',
                   *[str(path) for path in Path('ci/licenses/rust-compiler-originals').glob('*')]]
          for name in names:
              target = stage / name
              target.parent.mkdir(parents=True, exist_ok=True)
              shutil.copyfile(name, target)
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_REF }}
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: dtolnay/rust-toolchain@1.99.1
        with:
          targets: ${{ matrix.target }}
          components: rust-docs
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-about@0.9.3
      - name: Restore tooling without copying current binding APIs
        shell: python
        run: |
          import os
          import shutil
          import subprocess
          from pathlib import Path
          stage = Path(os.environ['RUNNER_TEMP']) / 'gnu-napi-tools'
          for source in stage.rglob('*'):
              if source.is_file():
                  target = Path(source.relative_to(stage))
                  target.parent.mkdir(parents=True, exist_ok=True)
                  shutil.copyfile(source, target)
          subprocess.run(['git', 'diff', '--exit-code', '--', 'Cargo.toml', 'crates', 'ts', 'tests', 'package.json', 'package-lock.json'], check=True)
      - name: Verify source and lock variant guards
        run: python -I -m unittest discover -s ci -p test_windows_gnu_napi_variant.py -v
      - name: Verify complete source/runtime grants and resource overlays
        run: python -I -m unittest discover -s ci -p test_napi_gnullvm_notices.py -v
      - name: Fetch the original locked dependency graph
        run: cargo fetch --locked
      - name: Install checksum-pinned LLVM MinGW SDK
        shell: python
        run: |
          import hashlib
          import os
          import stat
          import subprocess
          import urllib.request
          import zipfile
          from pathlib import Path, PurePosixPath
          root = Path(os.environ['RUNNER_TEMP'])
          sdk = root / 'gnu-napi-sdk'
          sdk.mkdir()
          archive_path = sdk / 'sdk.zip'
          url = 'https://github.com/mstorsjo/llvm-mingw/releases/download/20261020/llvm-mingw-20261020-ucrt-x86_64.zip'
          digest = hashlib.sha256()
          size = 0
          with urllib.request.urlopen(url, timeout=120) as source, archive_path.open('xb') as output:
              while chunk := source.read(1024 * 1024):
                  size += len(chunk)
                  if size > 256 * 1024 * 1024:
                      raise SystemExit('SDK archive exceeds bound')
                  digest.update(chunk)
                  output.write(chunk)
          if digest.hexdigest() != 'fd5462b7f5d93b2ff981fcd3f9c7e427e47f3203c64ea91c27bcc444eebd74cd':
              raise SystemExit('SDK archive differs from reviewed LLVM MinGW input')
          with zipfile.ZipFile(archive_path) as archive:
              seen = set()
              for item in archive.infolist():
                  path = PurePosixPath(item.filename)
                  if path.is_absolute() or '..' in path.parts or '\\' in item.filename or ':' in item.filename or item.filename.casefold() in seen or stat.S_ISLNK(item.external_attr >> 16):
                      raise SystemExit('unsafe or duplicate SDK member')
                  seen.add(item.filename.casefold())
              archive.extractall(sdk)
          install = sdk / 'llvm-mingw-20261020-ucrt-x86_64'
          compiler = install / 'bin' / os.environ['NAPI_COMPILER']
          if not compiler.is_file():
              raise SystemExit('exact target compiler missing')
          key = 'CARGO_TARGET_' + os.environ['NAPI_TARGET'].upper().replace('-', '_') + '_LINKER'
          flags = ['-C', 'target-feature=+crt-static', '-C', 'link-arg=-Wl,-Map,' + (root / 'gnu-napi-evidence/native-link.map').as_posix(), '-C', 'link-arg=-Wl,--reproduce=' + (root / 'gnu-napi-link.tar').as_posix()]
          with Path(os.environ['GITHUB_ENV']).open('a', encoding='utf-8') as output:
              for name, value in [(key, str(compiler)), ('CARGO_ENCODED_RUSTFLAGS', chr(31).join(flags)), ('LLVM_MINGW_PROBE', str(install))]:
                  output.write(name + '=' + value + '\n')
          with Path(os.environ['GITHUB_PATH']).open('a', encoding='utf-8') as output:
              output.write(str(install / 'bin') + '\n')
      - name: Prepare explicit derivative source and feature graph
        shell: python
        run: |
          import hashlib
          import json
          import os
          import subprocess
          import sys
          import urllib.request
          from pathlib import Path
          root = Path(os.environ['RUNNER_TEMP'])
          archive = root / 'napi-original-3.15.0.crate'
          with urllib.request.urlopen('https://static.crates.io/crates/napi/napi-3.15.0.crate', timeout=60) as source:
              raw = source.read(8 * 1024 * 1024 + 1)
          if len(raw) > 8 * 1024 * 1024 or hashlib.sha256(raw).hexdigest() != '6a746ad50efbfb632ade1de4025519a477decbbd798cea1a6ac41d7c44f80083':
              raise SystemExit('upstream napi archive identity differs')
          archive.write_bytes(raw)
          evidence = root / 'gnu-napi-evidence'
          config = subprocess.check_output([sys.executable, '-I', 'scripts/windows_gnu_napi_variant.py', str(archive), str(root / 'gnu-napi-vendor'), str(evidence)], text=True).strip()
          cfg = subprocess.check_output(['rustc', '--print', 'cfg', '--target', os.environ['NAPI_TARGET']], text=True)
          if 'target_os="windows"' not in cfg or 'target_env="gnu"' not in cfg:
              raise SystemExit('genuine GNU target cfg required')
          rustc = subprocess.check_output(['rustc', '--version', '--verbose'])
          if b'commit-hash: 58cf8f9c35b355199727627d07ae34a4e2846d67' not in rustc:
              raise SystemExit('unreviewed Rust compiler')
          (evidence / 'rustc.txt').write_bytes(rustc)
          (evidence / 'target-cfg.txt').write_text(cfg, encoding='utf-8')
          compiler = Path(os.environ['LLVM_MINGW_PROBE']) / 'bin' / os.environ['NAPI_COMPILER']
          (evidence / 'compiler-version.txt').write_bytes(subprocess.check_output([str(compiler), '--version']))
          record = json.loads((evidence / 'source-variant.json').read_text(encoding='utf-8'))
          record.update({'target': os.environ['NAPI_TARGET'], 'tooling_ref': os.environ['GITHUB_SHA'], 'sdk_archive_sha256': 'fd5462b7f5d93b2ff981fcd3f9c7e427e47f3203c64ea91c27bcc444eebd74cd', 'compiler_sha256': hashlib.sha256(compiler.read_bytes()).hexdigest()})
          (evidence / 'source-variant.json').write_text(json.dumps(record, sort_keys=True, indent=2) + '\n', encoding='utf-8')
          subprocess.run([sys.executable, '-I', 'scripts/prepare_gnu_napi_variant_notices.py', str(evidence), os.environ['NAPI_TARGET']], check=True)
          subprocess.run([sys.executable, '-I', 'scripts/napi_gnullvm_notices.py', 'prepare', str(evidence), os.environ['NAPI_TARGET']], check=True)
          environment = {**os.environ, 'KTAV_NAPI_NOTICES_GZIP': str(evidence / 'NOTICE.json.gz')}
          subprocess.run(['cargo', 'build', '--locked', '--release', '-p', 'ktav-napi', '--target', os.environ['NAPI_TARGET'], '--config', config], env=environment, check=True)
          if Path('Cargo.lock').read_bytes() != (evidence / 'Cargo.variant.lock').read_bytes():
              raise SystemExit('compiled variant lock changed')
      - name: Capture actual GNU PE and verify source-bound notices before native upload
        shell: python
        run: |
          import hashlib
          import json
          import os
          import re
          import struct
          import subprocess
          import sys
          from pathlib import Path
          root = Path(os.environ['RUNNER_TEMP'])
          evidence = root / 'gnu-napi-evidence'
          binary = Path('target') / os.environ['NAPI_TARGET'] / 'release/ktav_napi.dll'
          raw = binary.read_bytes()
          if len(raw) < 64 or len(raw) > 128 * 1024 * 1024 or raw[:2] != b'MZ':
              raise SystemExit('bounded native PE required')
          offset = int.from_bytes(raw[60:64], 'little')
          if offset + 24 > len(raw) or raw[offset:offset + 4] != b'PE\0\0' or struct.unpack_from('<H', raw, offset + 4)[0] != int(os.environ['NAPI_MACHINE']) or not struct.unpack_from('<H', raw, offset + 22)[0] & 0x2000:
              raise SystemExit('actual PE CPU/DLL kind differs')
          sdk = Path(os.environ['LLVM_MINGW_PROBE'])
          report = subprocess.check_output([str(sdk / 'bin/llvm-readobj.exe'), '--file-headers', '--coff-imports', '--coff-exports', str(binary)])
          (evidence / 'pe-inputs.txt').write_bytes(report)
          imports = [name.decode('ascii').lower() for name in re.findall(rb'^\s*Name: ([^\r\n]+[.]dll)\s*$', report, re.M | re.I)]
          allowed = {'kernel32.dll', 'ntdll.dll', 'ucrtbase.dll', 'msvcrt.dll', 'advapi32.dll', 'bcrypt.dll', 'bcryptprimitives.dll', 'crypt32.dll', 'dbghelp.dll', 'ole32.dll', 'oleaut32.dll', 'rpcrt4.dll', 'secur32.dll', 'shell32.dll', 'shlwapi.dll', 'user32.dll', 'userenv.dll', 'version.dll', 'ws2_32.dll', 'psapi.dll'}
          if not imports or any(name not in allowed and not name.startswith(('api-ms-win-', 'ext-ms-win-')) for name in imports):
              raise SystemExit('probe imports a non-OS runtime or libnode DLL: ' + repr(imports))
          if len(re.findall(rb'^\s*Name: napi_register_module_v1\s*$', report, re.M)) != 1:
              raise SystemExit('actual NAPI registration export missing')
          mapping = evidence / 'native-link.map'
          if not mapping.is_file() or not 0 < mapping.stat().st_size <= 32 * 1024 * 1024:
              raise SystemExit('actual GNU map missing or oversized')
          map_raw = mapping.read_bytes()
          if re.search(rb'(?i)(?:vcruntime|libcmt)[^\s()]*[.]lib|VC[/\\]Tools[/\\]MSVC', map_raw):
              raise SystemExit('actual map contains Microsoft startup inputs')
          subprocess.run([sys.executable, '-I', 'scripts/stage_gnu_napi_variant.py', 'capture', str(root / 'gnu-napi-link.tar'), str(evidence / 'link-input-fingerprints.json')], check=True)
          record = {'target': os.environ['NAPI_TARGET'], 'binary_sha256': hashlib.sha256(raw).hexdigest(), 'map_sha256': hashlib.sha256(map_raw).hexdigest(), 'imports': imports, 'machine': int(os.environ['NAPI_MACHINE']), 'scope': 'Actual GNU source-variant PE and linker input identity; runtime/resource gate recorded separately. Not npm or historical package clearance.'}
          (evidence / 'binary-verification.json').write_text(json.dumps(record, sort_keys=True, indent=2) + '\n', encoding='utf-8')
          subprocess.run([sys.executable, '-I', 'scripts/napi_gnullvm_notices.py', 'verify', str(evidence), str(binary), os.environ['NAPI_TARGET']], check=True)
      - name: Verify actual x64 Node consumer using the built GNU addon
        if: matrix.target == 'x86_64-pc-windows-gnullvm'
        shell: python
        run: |
          import hashlib
          import json
          import os
          import re
          import shutil
          import subprocess
          import sys
          from pathlib import Path
          subprocess.run(['npm.cmd', 'install', '--ignore-scripts', '--no-audit', '--no-fund'], check=True)
          subprocess.run(['npm.cmd', 'run', 'build:ts'], check=True)
          evidence = Path(os.environ['RUNNER_TEMP']) / 'gnu-napi-evidence'
          binary = Path('target') / os.environ['NAPI_TARGET'] / 'release/ktav_napi.dll'
          destination = Path('dist/native/ktav.win32-x64-msvc.node')
          destination.parent.mkdir(parents=True, exist_ok=True)
          shutil.copyfile(binary, destination)
          node = shutil.which('node.exe')
          if node is None:
              raise SystemExit('native Node executable missing')
          sdk = Path(os.environ['LLVM_MINGW_PROBE']).resolve()
          environment = dict(os.environ)
          environment['PATH'] = os.pathsep.join(value for value in os.environ['PATH'].split(os.pathsep) if value and not Path(value).resolve().is_relative_to(sdk) and 'visual studio' not in value.lower())
          script = 'import assert from "node:assert/strict";import {createRequire} from "node:module";import {realpathSync} from "node:fs";assert.equal(process.arch,"x64");await import("./dist/ts/node.js");const require=createRequire(import.meta.url);assert.deepEqual(Object.keys(require.cache).filter(p=>p.endsWith(".node")),[realpathSync("dist/native/ktav.win32-x64-msvc.node")]);await import("./tests/node/run-node-napi.mjs");'
          result = subprocess.run([node, '--input-type=module', '-e', script], env=environment, capture_output=True)
          (evidence / 'node-consumer-stdout.txt').write_bytes(result.stdout)
          (evidence / 'node-consumer-stderr.txt').write_bytes(result.stderr)
          sys.stdout.buffer.write(result.stdout)
          sys.stderr.buffer.write(result.stderr)
          if result.returncode:
              raise SystemExit('actual GNU NAPI Node corpus failed')
          summary = re.search(rb'\[node-napi\] (\d+)/(\d+) passed', result.stdout)
          if summary is None or summary[1] != summary[2] or int(summary[1]) == 0:
              raise SystemExit('native corpus incomplete or summary missing')
          record = {'target': os.environ['NAPI_TARGET'], 'binary_sha256': hashlib.sha256(binary.read_bytes()).hexdigest(), 'loaded_built_addon': True, 'sdk_path_removed': True, 'legacy_loader_filename': destination.name, 'scope': 'Legacy loader filename compatibility, not an MSVC target claim. Actual GNU target is recorded in compiler and PE evidence. ARM execution not claimed.'}
          (evidence / 'consumer-verification.json').write_text(json.dumps(record, sort_keys=True, indent=2) + '\n', encoding='utf-8')
      - name: Stage complete native legal and source roles after all gates
        shell: python
        run: |
          import os
          import subprocess
          import sys
          from pathlib import Path
          evidence = Path(os.environ['RUNNER_TEMP']) / 'gnu-napi-evidence'
          binary = Path('target') / os.environ['NAPI_TARGET'] / 'release/ktav_napi.dll'
          subprocess.run([sys.executable, '-I', 'scripts/stage_gnu_napi_variant.py', 'stage', str(evidence), str(binary), os.environ['NAPI_TARGET']], check=True)
      - uses: actions/upload-artifact@v4
        with:
          name: gnu-napi-native-candidate-${{ matrix.target }}
          path: ${{ runner.temp }}/gnu-napi-native-payload/
          include-hidden-files: true
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gnu-napi-variant-diagnostics-${{ matrix.target }}
          path: |
            ${{ runner.temp }}/gnu-napi-evidence/*.json
            ${{ runner.temp }}/gnu-napi-evidence/*.txt
            ${{ runner.temp }}/gnu-napi-evidence/*.map
            ${{ runner.temp }}/gnu-napi-evidence/*.lock
          if-no-files-found: warn
