name: Musl native compatibility

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  musl-addon:
    name: Musl addon and corpus (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            addon: ktav.linux-x64-musl.node
            platform: linux/amd64
          - target: aarch64-unknown-linux-musl
            addon: ktav.linux-arm64-musl.node
            platform: linux/arm64
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.14.0
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-zigbuild
      - run: npm install
      - run: npm run build:ts
      - name: Build and verify release-path addon
        env:
          MUSL_TARGET: ${{ matrix.target }}
        run: bash scripts/build-musl-addon.sh "$MUSL_TARGET"
      - uses: docker/setup-qemu-action@v3
        if: matrix.platform == 'linux/arm64'
        with:
          platforms: arm64
      - name: Run native corpus in Alpine
        shell: bash
        env:
          ADDON: ${{ matrix.addon }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          set -euo pipefail
          stage="$(mktemp -d)"
          mkdir -p "$stage/dist/native" "$stage/dist/ts" "$stage/spec"
          cp "$ADDON" "$stage/dist/native/$ADDON"
          cp -R dist/ts/. "$stage/dist/ts/"
          cp -R tests "$stage/tests"
          cp -R spec/versions "$stage/spec/versions"
          cp package.json "$stage/package.json"
          docker pull --platform "$PLATFORM" node:22-alpine
          docker run --rm --platform "$PLATFORM" --network none \
            --mount "type=bind,source=$stage,target=/work,readonly" \
            --workdir /work node:22-alpine /bin/sh -ec '
              node tests/node/run-node-napi.mjs
              node tests/node/run-edit-napi.mjs
              node tests/node/run-spec09-napi.mjs
            '
