name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      dry-run:
        description: "Build + pack only, skip npm publish (set to 'true')"
        required: false
        default: "false"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # ------------------------------------------------------------------
  # Build .node binaries across the napi-rs target matrix.
  # Each runner: checkout -> Rust + Node -> napi build -> upload
  # artifact. `@napi-rs/cli` handles triple naming + renaming.
  # ------------------------------------------------------------------
  build-native:
    name: .node / ${{ matrix.settings.target }}
    runs-on: ${{ matrix.settings.os }}
    strategy:
      fail-fast: false
      matrix:
        settings:
          # Windows
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            build: npx napi build --release -p ktav-napi --target x86_64-pc-windows-msvc --platform --js false --output-dir .
          - os: windows-latest
            target: aarch64-pc-windows-msvc
            build: npx napi build --release -p ktav-napi --target aarch64-pc-windows-msvc --platform --js false --output-dir .

          # macOS — both targets built on the `macos-latest` (Apple
          # Silicon) runner. Rust + Apple's clang cross-compile x86_64
          # from arm64 hosts natively, and the arm64 runner pool is
          # far less constrained than `macos-13` — avoids queue times
          # that routinely hit 20+ minutes on Intel-Mac runners.
          - os: macos-latest
            target: x86_64-apple-darwin
            build: npx napi build --release -p ktav-napi --target x86_64-apple-darwin --platform --js false --output-dir .
          - os: macos-latest
            target: aarch64-apple-darwin
            build: npx napi build --release -p ktav-napi --target aarch64-apple-darwin --platform --js false --output-dir .

          # Linux gnu — native x64, cross-compile arm64 via @napi-rs/cli.
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            build: npx napi build --release -p ktav-napi --target x86_64-unknown-linux-gnu --platform --js false --output-dir . --use-napi-cross
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            build: npx napi build --release -p ktav-napi --target aarch64-unknown-linux-gnu --platform --js false --output-dir . --use-napi-cross

          # Linux musl — Zig is the only reliable static-MUSL linker
          # on hosted runners; cargo-zigbuild is what napi-rs ships for.
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            build: npx napi build --release -p ktav-napi --target x86_64-unknown-linux-musl --platform --js false --output-dir . --use-napi-cross
          # aarch64-unknown-linux-musl uses cargo-zigbuild via
          # `--cross-compile` — @napi-rs/cross-toolchain doesn't ship
          # an x64→aarch64-musl linker pair, but zig's bundled musl
          # sysroot handles it cleanly. The `setup-zig` step below is
          # gated on the target name so it only runs here.
          - os: ubuntu-latest
            target: aarch64-unknown-linux-musl
            build: npx napi build --release -p ktav-napi --target aarch64-unknown-linux-musl --platform --js false --output-dir . --cross-compile

    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.settings.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.settings.target }}

      # Zig is only required by the `--cross-compile` build path — we
      # use it for aarch64-unknown-linux-musl (see matrix comment).
      # Skipping on every other target avoids a 150MB download × 7.
      - name: Install zig (for --cross-compile targets only)
        if: matrix.settings.target == 'aarch64-unknown-linux-musl'
        uses: mlugg/setup-zig@v2
        with:
          version: 0.14.0
      - name: Install cargo-zigbuild (for --cross-compile targets only)
        if: matrix.settings.target == 'aarch64-unknown-linux-musl'
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-zigbuild

      - run: npm ci --omit=optional
      - name: Build
        run: ${{ matrix.settings.build }}
      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: bindings-${{ matrix.settings.target }}
          path: "*.node"
          if-no-files-found: error

  # ------------------------------------------------------------------
  # Build the cdylib `ktav_cabi` for each platform — same C ABI as the
  # Java / Go / .NET bindings, consumed by the new `/ffi` subexport
  # (Deno via Deno.dlopen, Bun via bun:ffi). Dropped into each
  # `npm/<rid>/` subpackage at publish time.
  # ------------------------------------------------------------------
  build-cabi:
    name: cabi / ${{ matrix.settings.rid }}
    runs-on: ${{ matrix.settings.os }}
    strategy:
      fail-fast: false
      matrix:
        settings:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            rid: win32-x64-msvc
            artifact: ktav_cabi.dll
            use-zigbuild: false
          - os: windows-latest
            target: aarch64-pc-windows-msvc
            rid: win32-arm64-msvc
            artifact: ktav_cabi.dll
            use-zigbuild: false
          - os: macos-latest
            target: x86_64-apple-darwin
            rid: darwin-x64
            artifact: libktav_cabi.dylib
            use-zigbuild: false
          - os: macos-latest
            target: aarch64-apple-darwin
            rid: darwin-arm64
            artifact: libktav_cabi.dylib
            use-zigbuild: false
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            rid: linux-x64-gnu
            artifact: libktav_cabi.so
            use-zigbuild: true
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            rid: linux-arm64-gnu
            artifact: libktav_cabi.so
            use-zigbuild: true
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            rid: linux-x64-musl
            artifact: libktav_cabi.so
            use-zigbuild: true
          - os: ubuntu-latest
            target: aarch64-unknown-linux-musl
            rid: linux-arm64-musl
            artifact: libktav_cabi.so
            use-zigbuild: true

    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.settings.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: cabi-${{ matrix.settings.target }}

      - name: Install zig
        if: matrix.settings.use-zigbuild
        uses: mlugg/setup-zig@v2
        with:
          version: 0.14.0
      - name: Install cargo-zigbuild
        if: matrix.settings.use-zigbuild
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-zigbuild

      - name: Build (zigbuild)
        if: matrix.settings.use-zigbuild && !contains(matrix.settings.target, 'musl')
        run: cargo zigbuild --release -p ktav-cabi --target ${{ matrix.settings.target }}.2.17

      - name: Build (zigbuild musl)
        if: matrix.settings.use-zigbuild && contains(matrix.settings.target, 'musl')
        run: cargo zigbuild --release -p ktav-cabi --target ${{ matrix.settings.target }}

      - name: Build (native)
        if: ${{ !matrix.settings.use-zigbuild }}
        run: cargo build --release -p ktav-cabi --target ${{ matrix.settings.target }}

      - name: Stage artifact
        shell: bash
        run: |
          mkdir -p stage
          cp "target/${{ matrix.settings.target }}/release/${{ matrix.settings.artifact }}" \
             "stage/${{ matrix.settings.artifact }}"

      - uses: actions/upload-artifact@v7
        with:
          name: cabi-${{ matrix.settings.rid }}
          path: stage/${{ matrix.settings.artifact }}
          if-no-files-found: error

  # ------------------------------------------------------------------
  # Build wasm (web + bundler) — one job, any runner.
  # ------------------------------------------------------------------
  build-wasm:
    name: wasm targets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: rustup target add wasm32-unknown-unknown
      - run: cargo install wasm-pack --locked
      - run: npm ci --omit=optional
      - run: node scripts/build-wasm.mjs
      - uses: actions/upload-artifact@v7
        with:
          name: wasm
          path: dist/wasm
          if-no-files-found: error

  # ------------------------------------------------------------------
  # Assemble the npm tree: main `ktav` package + eight platform
  # subpackages. Publish each.
  # ------------------------------------------------------------------
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    needs: [build-native, build-cabi, build-wasm]
    if: startsWith(github.ref, 'refs/tags/v') && inputs.dry-run != 'true'
    environment:
      name: npm
      url: https://www.npmjs.com/package/ktav
    permissions:
      id-token: write  # npm OIDC (provenance)
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          registry-url: "https://registry.npmjs.org"

      - name: Download native artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts
          pattern: bindings-*
          merge-multiple: true

      - name: Download wasm artifacts
        uses: actions/download-artifact@v8
        with:
          name: wasm
          path: dist/wasm

      - run: npm ci --omit=optional

      - name: Build TypeScript
        run: npm run build:ts

      - name: Move native binaries into platform subpackages
        run: npx napi artifacts --npm-dir npm --build-output-dir artifacts

      - name: Download cabi artifacts
        uses: actions/download-artifact@v8
        with:
          path: cabi-staging
          pattern: cabi-*

      - name: Drop cabi binaries into platform subpackages
        shell: bash
        run: |
          set -e
          for dir in cabi-staging/cabi-*/; do
            rid="${dir#cabi-staging/cabi-}"
            rid="${rid%/}"
            file=$(ls "$dir")
            target="npm/${rid}/${file}"
            mkdir -p "npm/${rid}"
            cp -v "${dir}${file}" "$target"
          done
          echo "--- after layout ---"
          find npm -maxdepth 2 -type f -name '*ktav_cabi*' | sort

      - name: Publish platform subpackages
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          for dir in npm/*/; do
            echo "publishing $dir"
            # EPUBLISHCONFLICT (409 `already published`) is not fatal —
            # happens when a previous run got partway through the
            # matrix then hit a separate error. Every other non-zero
            # exit propagates.
            if ! out=$(npm publish --access public --provenance --tag latest "$dir" 2>&1); then
              echo "$out"
              if echo "$out" | grep -qE "EPUBLISHCONFLICT|previously published|cannot publish over"; then
                echo "[publish] $dir already on registry — skipping"
                continue
              fi
              exit 1
            fi
          done

      - name: Publish main ktav
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if ! out=$(npm publish --access public --provenance --tag latest 2>&1); then
            echo "$out"
            if echo "$out" | grep -qE "EPUBLISHCONFLICT|previously published|cannot publish over"; then
              echo "[publish] main package already on registry — skipping"
              exit 0
            fi
            exit 1
          fi

  # ------------------------------------------------------------------
  # GitHub Release — pulls notes from the matching `## X.Y.Z` section
  # of CHANGELOG.md. Runs after npm publish so a failed publish doesn't
  # leave a misleading GH Release behind.
  # ------------------------------------------------------------------
  github-release:
    name: GitHub Release
    runs-on: ubuntu-latest
    needs: [publish]
    if: startsWith(github.ref, 'refs/tags/v') && inputs.dry-run != 'true'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      - name: Extract release notes from CHANGELOG.md
        id: notes
        shell: bash
        run: |
          ver="${GITHUB_REF#refs/tags/v}"
          # JS changelog uses `## X.Y.Z` (no brackets); awk handles both.
          notes=$(awk -v v="$ver" '
            $0 ~ "^## (\\[)?" v "(\\])?( |$)" { in_section = 1; next }
            in_section && /^## / { exit }
            in_section { print }
          ' CHANGELOG.md)
          {
            echo "body<<__END_NOTES__"
            echo "$notes"
            echo "__END_NOTES__"
          } >> "$GITHUB_OUTPUT"

      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body: ${{ steps.notes.outputs.body }}
          fail_on_unmatched_files: false
