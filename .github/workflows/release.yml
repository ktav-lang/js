name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      dry-run:
        description: "Build + pack only, skip npm publish (set to 'true')"
        required: false
        default: "false"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # ------------------------------------------------------------------
  # Build .node binaries across the napi-rs target matrix.
  # Each runner: checkout -> Rust + Node -> napi build -> upload
  # artifact. `@napi-rs/cli` handles triple naming + renaming.
  # ------------------------------------------------------------------
  build-native:
    name: .node / ${{ matrix.settings.target }}
    runs-on: ${{ matrix.settings.os }}
    strategy:
      fail-fast: false
      matrix:
        settings:
          # Windows
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            build: npx napi build --release -p ktav-napi --target x86_64-pc-windows-msvc --platform --js false --output-dir .
          - os: windows-latest
            target: aarch64-pc-windows-msvc
            build: npx napi build --release -p ktav-napi --target aarch64-pc-windows-msvc --platform --js false --output-dir .

          # macOS — native x64 and arm64 runners both available.
          - os: macos-13
            target: x86_64-apple-darwin
            build: npx napi build --release -p ktav-napi --target x86_64-apple-darwin --platform --js false --output-dir .
          - os: macos-latest
            target: aarch64-apple-darwin
            build: npx napi build --release -p ktav-napi --target aarch64-apple-darwin --platform --js false --output-dir .

          # Linux gnu — native x64, cross-compile arm64 via @napi-rs/cli.
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            build: npx napi build --release -p ktav-napi --target x86_64-unknown-linux-gnu --platform --js false --output-dir . --use-napi-cross
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            build: npx napi build --release -p ktav-napi --target aarch64-unknown-linux-gnu --platform --js false --output-dir . --use-napi-cross

          # Linux musl — Zig is the only reliable static-MUSL linker
          # on hosted runners; cargo-zigbuild is what napi-rs ships for.
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            build: npx napi build --release -p ktav-napi --target x86_64-unknown-linux-musl --platform --js false --output-dir . --use-napi-cross
          - os: ubuntu-latest
            target: aarch64-unknown-linux-musl
            build: npx napi build --release -p ktav-napi --target aarch64-unknown-linux-musl --platform --js false --output-dir . --use-napi-cross

    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.settings.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.settings.target }}
      - run: npm ci
      - name: Build
        run: ${{ matrix.settings.build }}
      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: bindings-${{ matrix.settings.target }}
          path: "*.node"
          if-no-files-found: error

  # ------------------------------------------------------------------
  # Build wasm (web + bundler) — one job, any runner.
  # ------------------------------------------------------------------
  build-wasm:
    name: wasm targets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: rustup target add wasm32-unknown-unknown
      - run: cargo install wasm-pack --locked
      - run: npm ci
      - run: node scripts/build-wasm.mjs
      - uses: actions/upload-artifact@v7
        with:
          name: wasm
          path: dist/wasm
          if-no-files-found: error

  # ------------------------------------------------------------------
  # Assemble the npm tree: main `ktav` package + eight platform
  # subpackages. Publish each.
  # ------------------------------------------------------------------
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    needs: [build-native, build-wasm]
    if: startsWith(github.ref, 'refs/tags/v') && inputs.dry-run != 'true'
    environment:
      name: npm
      url: https://www.npmjs.com/package/ktav
    permissions:
      id-token: write  # npm OIDC (provenance)
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          registry-url: "https://registry.npmjs.org"

      - name: Download native artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts
          pattern: bindings-*
          merge-multiple: true

      - name: Download wasm artifacts
        uses: actions/download-artifact@v8
        with:
          name: wasm
          path: dist/wasm

      - run: npm ci

      - name: Build TypeScript
        run: npm run build:ts

      - name: Move native binaries into platform subpackages
        run: npx napi artifacts --npm-dir npm --build-output-dir artifacts

      - name: Publish platform subpackages
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          for dir in npm/*/; do
            echo "publishing $dir"
            npm publish --access public --provenance --tag latest "$dir" || exit 1
          done

      - name: Publish main ktav
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --access public --provenance --tag latest
