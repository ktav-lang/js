name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      dry-run:
        description: "Build + pack only, skip npm publish (set to 'true')"
        required: false
        default: "false"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # mlugg/setup-zig@v2 still ships a Node 20 entrypoint; GitHub forces
  # JS actions onto Node 24 from 2026-06-02 anyway. Opt in early to
  # silence the deprecation warning and exercise the new runtime now.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  auth-preflight:
    name: Verify npm Trusted Publishers
    if: startsWith(github.ref, 'refs/tags/v') && inputs.dry-run != 'true'
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      - run: node scripts/check-npm-trust.mjs

  native-packages:
    name: Build and pack verified native npm candidates
    needs: auth-preflight
    if: ${{ always() && (needs.auth-preflight.result == 'success' || needs.auth-preflight.result == 'skipped') }}
    uses: ./.github/workflows/native-npm-release-build.yml

  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    needs: [native-packages]
    if: startsWith(github.ref, 'refs/tags/v') && inputs.dry-run != 'true'
    environment:
      name: npm
      url: https://www.npmjs.com/package/@ktav-lang/ktav
    permissions:
      contents: read
      id-token: write  # npm OIDC (provenance)
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
      # An _authToken entry shadows npm's OIDC exchange.
      - name: Remove classic npm auth configuration
        shell: bash
        run: |
          npmrc="${NPM_CONFIG_USERCONFIG:-$HOME/.npmrc}"
          if [ -f "$npmrc" ]; then
            sed -i '/_authToken/d' "$npmrc"
          fi

      - name: Require npm with Trusted Publishing support
        shell: bash
        run: |
          version=$(npm --version)
          echo "npm $version"
          registry=$(npm config get registry)
          if [ "$registry" != "https://registry.npmjs.org/" ]; then
            echo "::error::unexpected npm registry: $registry"
            exit 1
          fi
          node -e '
            const [major, minor, patch] = process.argv[1].split(".").map(Number);
            if (major < 11 || (major === 11 && (minor < 5 || (minor === 5 && patch < 1)))) {
              throw new Error(`npm ${process.argv[1]} does not support Trusted Publishing (requires >=11.5.1)`);
            }
          ' "$version"

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download only the complete verified npm archive set
        uses: actions/download-artifact@v4
        with:
          name: native-npm-release-packages
          path: packed
      - name: Recheck actual archives before any publication
        run: python -I scripts/check_release_npm.py packed

      # Trusted Publishing is required for each of the nine packages:
      # GitHub repo ktav-lang/js, workflow release.yml, environment npm.
      - name: Publish platform subpackages
        run: |
          for archive in packed/ktav-lang-js-*-0.8.1.tgz; do
            echo "publishing $archive"
            # EPUBLISHCONFLICT (409 `already published`) is not fatal —
            # happens when a previous run got partway through the
            # matrix then hit a separate error. Every other non-zero
            # exit propagates.
            if ! out=$(npm publish --access public --tag latest --provenance "$archive" 2>&1); then
              echo "$out"
              if echo "$out" | grep -qE "EPUBLISHCONFLICT|previously published|cannot publish over"; then
                echo "[publish] $archive already on registry — skipping"
                continue
              fi
              exit 1
            fi
          done

      - name: Publish main ktav
        run: |
          if ! out=$(npm publish --access public --tag latest --provenance "packed/ktav-lang-ktav-0.8.1.tgz" 2>&1); then
            echo "$out"
            if echo "$out" | grep -qE "EPUBLISHCONFLICT|previously published|cannot publish over"; then
              echo "[publish] main package already on registry — skipping"
              exit 0
            fi
            exit 1
          fi

  # ------------------------------------------------------------------
  # GitHub Release — pulls notes from the matching `## X.Y.Z` section
  # of CHANGELOG.md. Runs after npm publish so a failed publish doesn't
  # leave a misleading GH Release behind.
  # ------------------------------------------------------------------
  github-release:
    name: GitHub Release
    runs-on: ubuntu-latest
    needs: [publish]
    if: startsWith(github.ref, 'refs/tags/v') && inputs.dry-run != 'true'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      - name: Extract release notes from CHANGELOG.md
        id: notes
        shell: bash
        run: |
          ver="${GITHUB_REF#refs/tags/v}"
          # JS changelog uses `## X.Y.Z` (no brackets); awk handles both.
          notes=$(awk -v v="$ver" '
            $0 ~ "^## (\\[)?" v "(\\])?( |$)" { in_section = 1; next }
            in_section && /^## / { exit }
            in_section { print }
          ' CHANGELOG.md)
          {
            echo "body<<__END_NOTES__"
            echo "$notes"
            echo "__END_NOTES__"
          } >> "$GITHUB_OUTPUT"

      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body: ${{ steps.notes.outputs.body }}
          fail_on_unmatched_files: false
